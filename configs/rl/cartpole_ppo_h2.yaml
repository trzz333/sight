run:
  phase: H2
  name: cartpole_ppo_h2
  seed: 0
  out_dir: runs/rl

env:
  id: CartPole-v1
  n_envs: 1

algo:
  framework: stable-baselines3
  name: PPO
  policy: MlpPolicy
  device: cpu
  hyperparams: {}

train:
  total_timesteps: 25000

eval:
  eval_freq: 5000
  n_eval_episodes: 5
  deterministic: true

logging:
  format: ndjson

checkpoint:
  enabled: true
  filename: model.zip
