[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sight-agent"
version = "0.1.0"
description = "Sight external Python agent layer. See docs/sight-charter.md."
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    # H1 RL stack
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run excludes live_mss and live_godot. Opt-in commands:
#   pytest -m live_mss
#   pytest tests/rl/test_h3_godot_smoke.py -m live_godot -v --tb=short
addopts = "-ra -m 'not live_mss and not live_godot'"
markers = [
    "live_mss: live MSS capture smoke test (requires display, optional)",
    "live_godot: live Godot Signal Dodge H3 smoke test (requires SIGHT_GODOT_EXE)",
]
