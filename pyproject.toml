[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sight-agent"
version = "0.1.0"
description = "Sight external Python agent layer. See docs/sight-charter.md."
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run excludes live_mss. Invoke the live smoke with: pytest -m live_mss
addopts = "-ra -m 'not live_mss'"
markers = [
    "live_mss: live MSS capture smoke test (requires display, optional)",
]
